{% extends "base.html" %}
{% set titulo_pagina = "Editar fornecedor" if fornecedor else "Novo fornecedor" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ titulo_pagina }}</h1>
    <p>Cadastre dados de contato, prazo de entrega e pedido mínimo.</p>
  </div>
  <div class="actions">
    <a class="btn btn-secondary" href="{{ url_for('fornecedores.listar') }}">Voltar</a>
  </div>
</div>

{% if erro %}
  <div class="alert alert-danger" role="alert">{{ erro }}</div>
{% endif %}

<section class="card card-pad" style="max-width:760px;">
  <form method="post" action="{{ url_for('fornecedores.editar', fornecedor_id=fornecedor.id) if fornecedor else url_for('fornecedores.novo') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row-2">
      <div class="field">
        <label for="nome">Nome / Razão social</label>
        <input class="input" id="nome" name="nome" type="text" value="{{ dados.nome }}" required autofocus>
      </div>
      <div class="field">
        <label for="tipo">Tipo de fornecedor</label>
        <select class="input" id="tipo" name="tipo">
          {% for chave, rotulo in tipos.items() %}
            <option value="{{ chave }}" {% if dados.tipo == chave %}selected{% endif %}>{{ rotulo }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="contato">Pessoa de contato</label>
        <input class="input" id="contato" name="contato" type="text" value="{{ dados.contato }}" placeholder="Ex.: Marlon / Vendedor">
      </div>
      <div class="field">
        <label for="whatsapp">WhatsApp</label>
        <input class="input" id="whatsapp" name="whatsapp" type="text" value="{{ dados.whatsapp }}" placeholder="(11) 99999-9999">
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="site">Site ou catálogo online</label>
        <input class="input" id="site" name="site" type="text" value="{{ dados.site }}" placeholder="https://...">
      </div>
      <div class="field">
        <label for="cidade_uf">Cidade / UF / País</label>
        <input class="input" id="cidade_uf" name="cidade_uf" type="text" value="{{ dados.cidade_uf }}" placeholder="Ex.: São Paulo/SP">
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="prazo_dias">Prazo médio de entrega (dias)</label>
        <input class="input num" id="prazo_dias" name="prazo_dias" type="number" min="0" value="{{ dados.prazo_dias }}">
      </div>
      <div class="field">
        <label for="pedido_minimo">Pedido mínimo</label>
        <div class="money">
          <span>R$</span>
          <input class="input num" id="pedido_minimo" name="pedido_minimo" type="text" value="{{ dados.pedido_minimo }}">
        </div>
      </div>
    </div>

    <div class="field">
      <label for="observacoes">Observações (condições, frete, cupom)</label>
      <textarea class="input" id="observacoes" name="observacoes" rows="3">{{ dados.observacoes }}</textarea>
    </div>

    <div class="form-foot">
      <a class="btn btn-secondary" href="{{ url_for('fornecedores.listar') }}">Cancelar</a>
      <button class="btn btn-primary" type="submit">Salvar fornecedor</button>
    </div>
  </form>
</section>
{% endblock %}
