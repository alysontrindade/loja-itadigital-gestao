{% extends "base.html" %}
{% set titulo_pagina = "Editar nicho" if nicho else "Novo nicho" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ titulo_pagina }}</h1>
    <p>Defina nome, cor da etiqueta no catálogo e descrição.</p>
  </div>
  <div class="actions">
    <a class="btn btn-secondary" href="{{ url_for('nichos.listar') }}">Voltar</a>
  </div>
</div>

{% if erro %}
  <div class="alert alert-danger" role="alert">{{ erro }}</div>
{% endif %}

<section class="card card-pad" style="max-width:640px;">
  <form method="post" action="{{ url_for('nichos.editar', nicho_id=nicho.id) if nicho else url_for('nichos.novo') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row-2">
      <div class="field">
        <label for="nome">Nome do nicho</label>
        <input class="input" id="nome" name="nome" type="text" value="{{ dados.nome }}" required autofocus>
      </div>
      <div class="field">
        <label for="cor">Cor da etiqueta</label>
        <input class="color-input" id="cor" name="cor" type="color" value="{{ dados.cor }}">
      </div>
    </div>

    <div class="field">
      <label for="descricao">Descrição</label>
      <textarea class="input" id="descricao" name="descricao" rows="3">{{ dados.descricao }}</textarea>
    </div>

    <div class="form-foot">
      <a class="btn btn-secondary" href="{{ url_for('nichos.listar') }}">Cancelar</a>
      <button class="btn btn-primary" type="submit">Salvar nicho</button>
    </div>
  </form>
</section>
{% endblock %}
