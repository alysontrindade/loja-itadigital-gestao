{% extends "base.html" %}
{% set titulo_pagina = "Editar cliente" if cliente else "Novo cliente" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ titulo_pagina }}</h1>
    <p>Preencha nome, WhatsApp e aniversário para atendimento personalizado.</p>
  </div>
  <div class="actions">
    <a class="btn btn-secondary" href="{{ url_for('clientes.listar') }}">Voltar</a>
  </div>
</div>

{% if erro %}
  <div class="alert alert-danger" role="alert">{{ erro }}</div>
{% endif %}

<section class="card card-pad" style="max-width:680px;">
  <form method="post" action="{{ url_for('clientes.editar', cliente_id=cliente.id) if cliente else url_for('clientes.novo') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field">
      <label for="nome">Nome completo</label>
      <input class="input" id="nome" name="nome" type="text" value="{{ dados.nome }}" required autofocus>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="whatsapp">WhatsApp (opcional)</label>
        <input class="input" id="whatsapp" name="whatsapp" type="text" value="{{ dados.whatsapp }}" placeholder="(38) 99999-9999">
      </div>
      <div class="field">
        <label for="email">E-mail (opcional)</label>
        <input class="input" id="email" name="email" type="email" value="{{ dados.email }}">
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="cidade">Cidade</label>
        <input class="input" id="cidade" name="cidade" type="text" value="{{ dados.cidade }}" placeholder="Itamarandiba">
      </div>
      <div class="field">
        <label for="aniversario">Aniversário</label>
        <input class="input" id="aniversario" name="aniversario" type="text" value="{{ dados.aniversario }}" placeholder="DD/MM ou AAAA-MM-DD">
      </div>
    </div>

    <div class="field">
      <label for="observacoes">Preferências / Observações</label>
      <textarea class="input" id="observacoes" name="observacoes" rows="3">{{ dados.observacoes }}</textarea>
    </div>

    <div class="form-foot">
      <a class="btn btn-secondary" href="{{ url_for('clientes.listar') }}">Cancelar</a>
      <button class="btn btn-primary" type="submit">Salvar cliente</button>
    </div>
  </form>
</section>
{% endblock %}
