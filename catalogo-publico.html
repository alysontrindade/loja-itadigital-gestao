<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ita Arte 3D — Catálogo Público de Produtos</title>
  <link rel="icon" href="./ita-arte-3d.ico" />
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background:#09090b; color:#fafafa; }
    .pub-wrap { max-width:1120px; margin:0 auto; padding:28px 20px 60px; }
    .pub-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:20px; margin-bottom:24px; }
    .pub-brand { display:flex; align-items:center; gap:14px; }
    .pub-logo { width:56px; height:56px; border-radius:12px; object-fit:cover; border:1px solid rgba(255,255,255,.12); }
    h1 { margin:0; font-size:22px; }
    .pub-sub { margin:3px 0 0; color:#a1a1aa; font-size:13px; }
    .pub-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .pub-btn, .pub-select { border:1px solid rgba(255,255,255,.15); background:#18181b; color:#fafafa; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; text-decoration:none; }
    .pub-btn.primary { background:#0070f3; border-color:#0070f3; }
    .pub-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; }
    .pub-card { background:#111114; border:1px solid rgba(255,255,255,.1); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; break-inside:avoid; }
    .pub-thumb { aspect-ratio:4/3; background:#18181b; display:grid; place-items:center; overflow:hidden; }
    .pub-thumb img { width:100%; height:100%; object-fit:cover; }
    .pub-no-img { color:#71717a; font-size:13px; }
    .pub-body { padding:14px; display:flex; flex-direction:column; gap:8px; flex:1; }
    .pub-meta { display:flex; align-items:center; gap:6px; font-size:11px; color:#a1a1aa; }
    .pub-code { font-family: ui-monospace, monospace; background:rgba(255,255,255,.08); padding:2px 6px; border-radius:4px; color:#fafafa; }
    .pub-card h3 { margin:0; font-size:15px; line-height:1.35; }
    .pub-dims { font-size:12px; color:#a1a1aa; }
    .pub-footer { margin-top:auto; padding-top:8px; border-top:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .pub-price { font-size:17px; color:#38bdf8; font-variant-numeric:tabular-nums; }
    .pub-badge { font-size:11px; padding:3px 8px; border-radius:999px; }
    .pub-badge.ready { background:rgba(22,163,74,.2); color:#4ade80; }
    .pub-badge.order { background:rgba(255,255,255,.08); color:#d4d4d8; }
    @media print {
      body { background:#ffffff; color:#111111; }
      .pub-actions { display:none; }
      .pub-card { background:#ffffff; border-color:#d4d4d8; }
      .pub-price { color:#0369a1; }
    }
  </style>
</head>
<body>
  <div class="pub-wrap">
    <header class="pub-head">
      <div class="pub-brand">
        <img src="./media/catalog/logo-ita-arte-3d.jpg" alt="Ita Arte 3D" class="pub-logo" onerror="this.style.display='none'" />
        <div>
          <h1>Ita Arte 3D — Catálogo de Produtos</h1>
          <p class="pub-sub">Impressão 3D personalizada • Peças exclusivas sob medida</p>
        </div>
      </div>
      <div class="pub-actions">
        <select id="pub-cat-filter" class="pub-select">
          <option value="">Todas as categorias</option>
        </select>
        <a class="pub-btn" href="./index.html">Abrir Painel Interno</a>
        <button class="pub-btn primary" onclick="window.print()">Imprimir / Salvar PDF</button>
      </div>
    </header>
    <div id="pub-grid" class="pub-grid"></div>
  </div>

  <script type="module">
    import { getPublicCatalogSnapshot } from "./serverless_hub.js";
    import { escapeHtml, formatBrl } from "./utils.js";

    let allItems = [];

    function renderGrid(catFilter = "") {
      const active = allItems.filter((i) => i.active !== false && (!catFilter || (i.categories || [i.category]).includes(catFilter)));
      const grid = document.getElementById("pub-grid");
      if (!active.length) {
        grid.innerHTML = '<p style="color:#a1a1aa">Nenhum produto ativo neste filtro.</p>';
        return;
      }
      grid.innerHTML = active.map((item) => {
        const img = item.image_url
          ? `<img src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.name)}" loading="lazy" />`
          : '<div class="pub-no-img">Ita Arte 3D</div>';
        const stockTag = Number(item.stock_qty || 0) > 0
          ? `<span class="pub-badge ready">Pronta entrega (${item.stock_qty})</span>`
          : '<span class="pub-badge order">Sob encomenda</span>';
        const pairs = item.classifications || [{ category: item.category, subcategory: item.subcategory || "" }];
        const labels = pairs.map((c) => (c.subcategory ? `${c.category} › ${c.subcategory}` : c.category)).join(" • ");
        return `
          <article class="pub-card">
            <div class="pub-thumb">${img}</div>
            <div class="pub-body">
              <div class="pub-meta">${item.code ? `<span class="pub-code">${escapeHtml(item.code)}</span>` : ""}<span>${escapeHtml(labels)}</span></div>
              <h3>${escapeHtml(item.name)}</h3>
              ${item.dimensions_cm ? `<div class="pub-dims">${escapeHtml(item.dimensions_cm)}</div>` : ""}
              <div class="pub-footer">
                <strong class="pub-price">${formatBrl(item.sale_price_brl)}</strong>
                ${stockTag}
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    async function initPublicCatalog() {
      allItems = await getPublicCatalogSnapshot();
      const cats = Array.from(new Set(allItems.flatMap((i) => i.categories || [i.category]).filter(Boolean))).sort();
      const sel = document.getElementById("pub-cat-filter");
      sel.innerHTML = '<option value="">Todas as categorias</option>' + cats.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
      sel.addEventListener("change", () => renderGrid(sel.value));
      renderGrid("");
    }

    initPublicCatalog();
  </script>
</body>
</html>
