<!doctype html>
<html lang="pt-BR" data-tema="{{ cfg.tema if cfg else 'claro' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ cfg.nome_loja if cfg else 'Loja Itamarandiba' }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/extras.css') }}">
</head>
<body>
  {% include "partials/_icons.html" %}
  <main class="auth-wrap">
    <section class="auth-card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for categoria, msg in messages %}
          <div class="alert alert-{{ categoria }}" role="status">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
